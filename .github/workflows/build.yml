name: Build & test DevNex

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release asset

jobs:
  database:
    name: Database security tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS suites + concurrent claim race
        run: |
          export PGBIN=/usr/lib/postgresql/16/bin
          ./backend/tests/run_tests.sh "$RUNNER_TEMP" | tee db-results.txt
          grep -q "ALL CHECKS PASSED" db-results.txt

  android:
    name: Android build, unit tests, APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DevNex-${{ github.run_number }}-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DevNex-apk
          path: DevNex-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/

  ui-test:
    name: Full app journey on an Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run journey test (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb shell mkdir -p /sdcard/Download/devnex
            ./gradlew --no-daemon connectedDebugAndroidTest || echo failed > ../ui_failed.txt
            adb pull /sdcard/Download/devnex ../screens || true
            adb logcat -d -s AndroidRuntime:E > ../crash_log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screens
          path: |
            screens/
            crash_log.txt
            android/app/build/reports/androidTests/
      - name: Print journey results
        if: always()
        run: |
          for f in android/app/build/outputs/androidTest-results/connected/debug/*.xml; do
            [ -f "$f" ] && python3 -c "import re,sys,html;t=open(sys.argv[1]).read();m=re.search(r'<failure[^>]*>(.*?)</failure>',t,re.S);print(html.unescape(m.group(1))[:6000] if m else 'JOURNEY: all steps passed')" "$f"
          done
          echo "--- crashes ---"; cat crash_log.txt 2>/dev/null | head -80 || true
      - name: Publish screenshots to the ci-screens branch
        if: always()
        run: |
          mkdir -p /tmp/s
          cp -r screens/. /tmp/s/ 2>/dev/null || true
          cp android/app/build/outputs/androidTest-results/connected/debug/*.xml /tmp/s/ 2>/dev/null || true
          cp crash_log.txt /tmp/s/ 2>/dev/null || true
          cd /tmp/s && git init -q && git checkout -q -b ci-screens && git add -A
          git -c user.name=devnex-ci -c user.email=ci@devnex.app commit -qm "journey screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens
      - name: Fail if the journey failed
        run: test ! -f ui_failed.txt

  release:
    name: Publish APK
    if: github.ref == 'refs/heads/main'
    needs: [database, android, ui-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DevNex-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DevNex build ${{ github.run_number }}
          prerelease: true
          files: DevNex-*.apk
          body: |
            Debug APK built from ${{ github.sha }}. Runs in Demo mode (sample data, password `devnex123`).
            Passed: database security suites, unit tests, and the full app journey on an Android 14 emulator.
            Install: open this page on your Android phone, download the APK, allow "Install unknown apps" when asked.
